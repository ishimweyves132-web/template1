name: LifeOS apps
# Builds the LifeOS Android APK and the Windows and Linux desktop apps, tests the desktop builds by launching them,
# and publishes everything as one GitHub Release. Run it from the Actions tab ("Run workflow") or push a change under lifeos/.
on:
  workflow_dispatch:
  push:
    branches: [claude/french-mastery-tracker-app-jbyezh]
    paths: ["lifeos/**", ".github/workflows/lifeos-release.yml"]
permissions:
  contents: write
env:
  VERSION: 1.0.${{ github.run_number }}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifeos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifeos/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK licences and packages
        working-directory: .
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Use the fixed signing key if one is configured (optional secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            { echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.keystore"; echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"; echo "ANDROID_KEY_ALIAS=$KS_ALIAS"; echo "ANDROID_KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"; } >> "$GITHUB_ENV"
            echo "Signing with the configured fixed key"
          else
            echo "No fixed key configured: using Android's debug key"
          fi
      - name: Build APK
        working-directory: lifeos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=$VERSION
      - name: Check the APK is real
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$APK" | grep -E "^package|application-label:|sdkVersion"
          cp "$APK" "LifeOS-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-android
          path: lifeos/LifeOS-*.apk
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lifeos
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifeos/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never --config.extraMetadata.version=$env:VERSION
      - name: Launch the packaged app and check it works
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $p = Start-Process -FilePath ".\release\win-unpacked\LifeOS.exe" -ArgumentList "--smoke","--smoke-out=$out","--smoke-shot=$env:RUNNER_TEMP\smoke.png" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - run: Get-ChildItem release | Where-Object { $_.Extension -eq ".exe" } | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-windows
          path: |
            lifeos/release/LifeOS-Setup-*.exe
            lifeos/release/LifeOS-Portable-*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifeos/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never --config.extraMetadata.version=$VERSION
      - name: Launch the packaged app and check it works
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a ./release/linux-unpacked/lifeos --no-sandbox --disable-gpu --smoke --smoke-out="$RUNNER_TEMP/smoke.txt" --smoke-shot="$RUNNER_TEMP/smoke.png" || { cat "$RUNNER_TEMP/smoke.txt" 2>/dev/null; exit 1; }
          cat "$RUNNER_TEMP/smoke.txt"
      - run: ls -la release/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-linux
          path: lifeos/release/LifeOS-*.AppImage
          if-no-files-found: error

  release:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Publish a permanent GitHub Release (every version is kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-artifacts
          SIGN="Android debug key"
          [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ] && SIGN="your fixed Android key"
          {
            echo "LifeOS $VERSION, built from commit ${GITHUB_SHA::7}."
            echo
            echo "- Android: LifeOS-$VERSION.apk (signed with the $SIGN)."
            echo "- Windows: LifeOS-Setup-$VERSION.exe (installer) or LifeOS-Portable-$VERSION.exe (no install)."
            echo "- Linux: LifeOS-$VERSION-x86_64.AppImage."
            echo "- The Windows and Linux apps were launched in CI and checked to start, render and store data. The Android APK was built but not run on a phone."
            echo "- Windows may show a SmartScreen warning (the app is not code-signed): More info, then Run anyway."
            echo
            echo "Latest commit message:"
            echo
            git log -1 --pretty=%B
          } > notes.md
          gh release create "lifeos-v$VERSION" dist-artifacts/* --title "LifeOS $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --prerelease
