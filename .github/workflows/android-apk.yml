name: Build Android APK
# Builds an installable APK of French Mastery Tracker on GitHub's servers (which include the Android SDK).
# Run it from the Actions tab ("Run workflow"), then download the "french-mastery-apk" artifact.
on:
  workflow_dispatch:
  push:
    branches: [claude/french-mastery-tracker-app-jbyezh]
    paths: ["french-tracker/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write   # needed to publish a GitHub Release for every build
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: french-tracker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: french-tracker/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK - accept licences and install what the project needs
        working-directory: .
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm test
      - name: Download Wiktionary French data (kaikki.org) and build the dictionary pack
        # The downloaded file is treated as data: it lives in its own directory and is only passed as an argument.
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaikki public/dict
          curl -fL --retry 5 --retry-delay 5 -o /tmp/kaikki/french.jsonl https://kaikki.org/dictionary/French/kaikki.org-dictionary-French.jsonl
          ls -la /tmp/kaikki
          head -c 700 /tmp/kaikki/french.jsonl; echo
          node tools/build-pack.mjs --in /tmp/kaikki/french.jsonl --lang en --out public/dict --version "$(date -u +%Y-%m)-f2" \
            --source "Wiktionary (English edition) via kaikki.org / Wiktextract" --license "CC BY-SA 4.0 and GFDL" --min-entries 20000 --max-mb 60
          ls -la public/dict && cat public/dict/manifest.json
      - name: Verify the dictionary pack against well-known words
        run: node tools/verify-pack.mjs public/dict "chat:m:cat,maison:f:house,être::be,avoir::have,aller::go,bonjour::hello,merci::thank,école:f:school,livre:m:book,eau:f:water,ville:f:city,pays:m:country,ami:m:friend,femme:f:woman,homme:m:man,temps:m:time,travail:m:work,langue:f:language,manger::eat,français::french" "manger:mangeons,être:sommes,avoir:avons,aller:allons,chat:chats,beau:belle,chanter:chantons"
      - run: npm run build
      - run: npx cap sync android
      - name: Use the fixed signing key if one is configured (optional secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            { echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.keystore"; echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"; echo "ANDROID_KEY_ALIAS=$KS_ALIAS"; echo "ANDROID_KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"; } >> "$GITHUB_ENV"
            echo "Signing with the configured fixed key"
          else
            echo "No fixed key configured: using Android's debug key (each build then has a different signature)"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}
        working-directory: french-tracker/android
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk french-mastery-tracker-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: french-mastery-apk-v1.0.${{ github.run_number }}
          path: french-tracker/french-mastery-tracker-v1.0.*.apk
          if-no-files-found: error
      - name: Publish a permanent GitHub Release (every version is kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          SIGN="debug key (differs per build: uninstall the previous version before installing this one)"
          [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && SIGN="fixed key (installs over the previous version, your data is kept)"
          DICT="$(python3 -c "import json;m=json.load(open('public/dict/manifest.json'));print(f\"{m['count']:,} entries, pack {m['size']/1e6:.1f} MB, version {m['version']}\")" 2>/dev/null || echo unknown)"
          printf '%s\n' "Build $V from commit ${GITHUB_SHA::7}." "" "- Dictionary: $DICT (Wiktionary via kaikki.org, CC BY-SA 4.0 / GFDL)" "- Signed with: $SIGN" "- Not tested on a physical device." "" "Latest commit message:" "" "$(git log -1 --pretty=%B)" > "$RUNNER_TEMP/notes.md"
          gh release create "v$V" "french-mastery-tracker-v$V.apk" --title "French Mastery Tracker $V" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --prerelease
